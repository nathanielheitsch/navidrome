[package]
name = "nd-stream"
description = "Rust port of core/stream/** decision tables (issue #14, docs/rust-port/issues.md Part B); #15 owns the serving half"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nd-conf = { version = "0.1.0", path = "../nd-conf" }
nd-ffmpeg = { version = "0.1.0", path = "../nd-ffmpeg" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jsonwebtoken = { workspace = true }
# Serving half (#15): `fs` for tokio::fs file access, `io-util` for AsyncRead.
# Deliberately narrow — the workspace pin is `^1` and `full` is not used here
# (siblings narrow the same way: nd-db/Cargo.toml, nd-events/Cargo.toml).
tokio = { workspace = true, features = ["rt", "macros", "fs", "io-util", "time"] }

[dev-dependencies]
# `rt-multi-thread` for the concurrent contention lanes and `sync` for the
# rendezvous primitives they use to hold permits open across threads.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "test-util"] }

[lints]
workspace = true
