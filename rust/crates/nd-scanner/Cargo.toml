[package]
name = "nd-scanner"
description = "Rust port scaffold: nd-scanner is owned by #17 (docs/rust-port/issues.md Part B)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# SC-02 remainder manifest: the six direct dependencies the user approved (exact list),
# every one of them already pinned in `rust/Cargo.lock`. No other manifest in the
# workspace is touched and no new package/version/checksum edge is introduced.
# nd-mapping: reuse `file_types` classification rather than duplicating MIME logic.
nd-mapping = { path = "../nd-mapping" }
# chrono: checked UTC calendar decomposition for the Go `time.Time.String` hash spelling.
chrono = "0.4"
# md-5: raw MD5 (`crypto/md5`) for the folder fingerprint, rendered as lowercase hex.
md-5 = "0.10"
# regex: scanner-local translation of the pinned Go matcher (`sabhiram/go-gitignore`,
# go.mod:52). Rust regex is *not* asserted equivalent to every Go regexp spelling:
# constructs the two engines disagree on are reported, never silently reinterpreted.
regex = "1.13"
# tokio: wakeable cancellation (`watch`) and the bounded capacity-1 folder stream.
tokio = { workspace = true }
# thiserror: typed scanner errors, per the workspace error-type freeze.
thiserror = { workspace = true }
# SC-03 additions (parent-authorized in the SC-03 brief, extending the `nd-db` edge the
# SC-01 ratification already authorized): the mapping bridge and the singleton
# projection consume the DB record types and the checked role bridge. All three are
# workspace path crates already pinned in rust/Cargo.lock, so the lock diff is only
# nd-scanner's dependency-edge stanzas — zero new [[package]] entries.
# nd-db: MediaFileRecord/AlbumRecord/ArtistRecord, sql_participations::role_from_id,
#        sql_tags::DbTags, album_repo::NamedParticipant.
nd-db = { path = "../nd-db" }
# nd-id: Go model.Role constants for the participant projection.
nd-id = { path = "../nd-id" }
# nd-tagreader: read_metadata over the real committed fixtures, so the bridge is
# exercised on actual parses rather than a stubbed Info.
nd-tagreader = { path = "../nd-tagreader" }
# nd-utils (SC-05): the `context::Cancellation` flag DB-11's frozen visitors take as
# their cancellation parameter (`scanner_queries.rs:344-350`). SC-01 ratification seam 4
# makes the CancelToken -> Cancellation adaptation SC-05's own, so this edge is forced by
# the frozen signature rather than chosen. Already pinned in rust/Cargo.lock (nd-db and
# nd-mapping both depend on it), so the lock delta is a dependency edge only — no new
# [[package]] entry.
nd-utils = { path = "../nd-utils" }

[dev-dependencies]
# nd-dbschema (test-only): `apply_fresh_schema` for the phase-1 vertical's DB fixture,
# the same seam nd-db's own runtime tests use (`tests/runtime_folder_writes.rs:126-135`).
# Also already pinned in rust/Cargo.lock (nd-db depends on it): no new package entry.
nd-dbschema = { path = "../nd-dbschema" }

[lints]
workspace = true
