[package]
name = "nd-cli"
description = "Rust port scaffold: nd-cli is owned by #33 (docs/rust-port/issues.md Part B)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Binary entrypoint: the service graph (DI replacement) is constructed here by #33.
[[bin]]
name = "nd-cli"
path = "src/main.rs"

# BOOT-01 increment A: the startup preflight needs the existing config loader
# only. No new third-party package is introduced — `rustix` (euid check) and
# `tempfile` (isolated test roots) are already in Cargo.lock via nd-ffmpeg /
# nd-utils, and the workspace pins their features.
[dependencies]
nd-conf = { path = "../nd-conf" }
thiserror = { workspace = true }
# geteuid for the EnforceNonRootUser check (`process` feature, already locked).
rustix = { workspace = true }
# BOOT-01 increment B (signing-property codec): `sha2`, `base64` and `rand` are
# already locked through nd-utils/nd-auth/nd-id, so `--locked` builds gain only
# the AES-GCM subtree documented in the workspace manifest — no new entropy or
# hashing package. `rand::rngs::OsRng` (fallible OS entropy, via rand's already
# enabled `os_rng` feature) supplies nonces and generated candidates. Version
# spelled like the other consumers do (nd-utils/Cargo.toml:12,
# nd-db/Cargo.toml:34), since sha2 is not a workspace dependency.
sha2 = "^0.10"
base64 = { workspace = true }
rand = { workspace = true }
aes-gcm = { workspace = true }
# BOOT-01 increment C (caller transaction over the migrated store): existing
# workspace crates only. `nd-db` supplies the pool/transaction runtime and the
# library/property repositories; `nd-auth` supplies `setup_in_tx` and argon2id
# hashing. `rusqlite` is named directly because this module matches on extended
# SQLite result codes, and `bundled` matches nd-db/nd-auth so a locked build
# needs no system SQLite.
nd-db = { path = "../nd-db" }
nd-auth = { path = "../nd-auth" }
# BOOT-01 increment D (database assembly): `nd-dbschema` is a LIBRARY dependency
# here, not only a dev one — `src/database.rs` classifies the DB input with
# `schema::parse_open_input` before opening and runs the single fresh migration
# through `migrate::ensure_fresh_migration`, so a plain `cargo check -p nd-cli`
# must compile it. It is an existing workspace crate, so Cargo.lock gains no
# package: the edge already exists (nd-db depends on nd-dbschema).
nd-dbschema = { path = "../nd-dbschema" }
rusqlite = { version = "0.32", features = ["bundled"] }
# Library stamps are `DateTime<Utc>`, the workspace-wide timestamp convention.
chrono = { workspace = true }
# BOOT-01 increment E (startup assembly): the heavy chain runs in
# `tokio::task::spawn_blocking` and reports its worker thread over a oneshot —
# exactly the boundary nd-db already uses. Features spell out `rt` + `sync`
# (like nd-db/Cargo.toml:36), so no new tokio feature is added to the lock.
# BOOT-04 adds `signal` for the process termination set Go registers
# (`cmd/root.go:114-121`); `libc`/`signal-hook-registry`/`mio` are already in the
# lock via tokio's own `full` feature elsewhere in the workspace, so this adds a
# feature edge and no new package.
tokio = { workspace = true, features = ["rt", "sync", "signal"] }
# BOOT-01 stream-state slice: `nd-stream` supplies the transcoding cache
# (`TranscodeCache`, `TRANSCODING_CACHE_DIR`, the fixed item budget and cleanup
# interval) and the shareable `TranscodeLimiter`. An existing workspace crate, so
# Cargo.lock gains only the nd-cli -> nd-stream edge, no new package.
nd-stream = { path = "../nd-stream" }
# BOOT-01 B2 CLI integration: inject the loaded FFmpegPath into the nd-ffmpeg
# resolver before filesystem setup. An existing workspace crate (nd-stream already
# depends on it), so Cargo.lock gains only the nd-cli -> nd-ffmpeg edge.
nd-ffmpeg = { path = "../nd-ffmpeg" }
# BOOT-04 CLI wiring: `nd-http` supplies the TCP listener and public shell, and
# nd-cli is the D1 injection point (`decisions.md:521`) — the direction is
# nd-cli -> nd-http, never nd-http -> nd-api, so the BOOT-00 cycle acceptance
# still holds. Both are existing workspace crates, so Cargo.lock gains only the
# nd-cli -> nd-http and nd-cli -> axum edges, no new package. `axum` is named
# because `Running::start` takes the router value being injected.
nd-http = { path = "../nd-http" }
axum = { workspace = true }
# SIGABRT for the Go signal set (`cmd/root.go:120`): tokio has no `SignalKind::abort()`,
# so the raw signum comes from libc. `libc` is already in Cargo.lock (tokio's unix
# dependency), so this adds an edge and no new package.
libc = "^0.2"

[dev-dependencies]
tempfile = "^3"
# The signing-property tests assert the exact StdEncoding wire format, so they
# decode/encode with the same crate the library uses rather than a hand-rolled
# base64 implementation that could itself be wrong.
base64 = { workspace = true }
# Real migrated temporary databases: the schema comes from the same
# `apply_fresh_schema` the production path uses, and `nd-id` names isolated
# in-memory databases (as nd-db's own tests do). `nd-dbschema` is now a library
# dependency (increment D), so only `nd-id` remains test-only here.
nd-id = { path = "../nd-id" }
# `#[tokio::test]` over the async startup entrypoint, same feature list nd-db's
# and nd-auth's dev-dependencies already use.
tokio = { workspace = true, features = ["rt", "macros", "sync", "test-util"] }
